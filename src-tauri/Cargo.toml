[package]
name = "lumaread"
version = "1.1.1"
description = "LumaRead — personal reading library"
authors = ["Aditya Ananda"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumaread_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-quoteshare = { path = "plugins/quoteshare" }
tauri-plugin-readaloud = { path = "plugins/readaloud" }
tauri-plugin-lansync = { path = "plugins/lansync" }


# Size-oriented release. On rustc 1.93, lto=true and strip=true both break host proc-macro
# loading (tauri_macros / phf_macros E0463). Strip the final binary after build instead.
[profile.release]
codegen-units = 1
lto = false
opt-level = "s"
panic = "unwind"
strip = false
